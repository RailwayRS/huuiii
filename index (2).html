<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Весёлый платформер</title>
<style>
  /* ===== Основные настройки ===== */
  :root{
    --display: "Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt","Segoe Print",cursive;
    --body: "Trebuchet MS", Verdana, "Segoe UI", sans-serif;
    --sun: #ffd23f;
    --orange: #ff8c1a;
    --blue: #2fa8ff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    position:fixed; inset:0; overflow:hidden; overscroll-behavior:none;
    background:#7ad0ff; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    font-family:var(--body);
  }

  canvas{ position:fixed; inset:0; display:block; touch-action:none; }

  /* ===== Верхняя панель (задание и монеты) ===== */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(10px + env(safe-area-inset-top)) 12px 0;
    pointer-events:none; gap:8px;
  }
  #task{
    background:rgba(255,255,255,.92); color:#2a5aa8;
    font-family:var(--display); font-size:15px; line-height:1.25;
    padding:8px 14px; border-radius:16px; border:3px solid var(--sun);
    box-shadow:0 4px 0 rgba(0,0,0,.12); max-width:62vw;
  }
  #task .kb{ display:none; font-size:12px; color:#7a8aa0; margin-top:2px; }
  @media (hover:hover) and (pointer:fine){ #task .kb{ display:block; } }

  #coins{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.92); padding:8px 12px; border-radius:16px;
    border:3px solid var(--sun); box-shadow:0 4px 0 rgba(0,0,0,.12);
    font-family:var(--display); font-size:15px; color:#a06a00;
  }
  .slot{
    width:20px; height:20px; border-radius:50%;
    background:#f3f6fa; border:3px solid #d7dee8; display:inline-block;
  }
  .slot.got{
    background:radial-gradient(circle at 35% 30%, #fff2a8, #ffd23f 55%, #e09f1f);
    border-color:#e09f1f; animation:pop .35s ease;
  }
  @keyframes pop{ 0%{transform:scale(.4)} 60%{transform:scale(1.35)} 100%{transform:scale(1)} }

  /* ===== Подсказка у флага ===== */
  #toast{
    position:fixed; top:calc(84px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%) translateY(-16px); z-index:6;
    background:#fff; color:#d95b36; font-family:var(--display); font-size:16px;
    padding:10px 18px; border-radius:16px; border:3px solid #ff8c5a;
    box-shadow:0 6px 14px rgba(0,0,0,.18);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ===== Экранные кнопки управления ===== */
  #controls{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    display:flex; justify-content:space-between; align-items:flex-end;
    padding:0 14px calc(14px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .pad{ display:flex; gap:14px; pointer-events:auto; }
  .btn{
    pointer-events:auto; border:none; cursor:pointer;
    min-width:68px; min-height:68px; width:clamp(70px,21vw,94px); height:clamp(70px,21vw,94px);
    border-radius:26px; color:#fff;
    font-family:var(--display); font-size:30px; line-height:1;
    background:linear-gradient(180deg,#4cc3ff,#1f8fe0);
    box-shadow:0 6px 0 #1670b5, 0 10px 16px rgba(0,0,0,.22);
    text-shadow:0 2px 0 rgba(0,0,0,.22);
    transition:transform .06s, box-shadow .06s;
  }
  .btn.jump{
    width:clamp(104px,32vw,150px); height:78px; border-radius:40px; font-size:20px; letter-spacing:1px;
    background:linear-gradient(180deg,#ffb02e,#ff8c1a);
    box-shadow:0 6px 0 #d0690a, 0 10px 16px rgba(0,0,0,.22);
  }
  .btn.press, .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.25); }

  /* ===== Оверлей победы и поражения ===== */
  #overlay{
    position:fixed; inset:0; z-index:10; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(20,60,110,.45);
  }
  #overlay.show{ display:flex; }
  #card{
    background:#fff; border:6px solid var(--sun); border-radius:28px;
    padding:26px 26px 24px; text-align:center; max-width:340px; width:100%;
    box-shadow:0 16px 40px rgba(0,0,0,.3);
    animation:cardIn .4s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes cardIn{ from{ transform:scale(.5); opacity:0 } to{ transform:scale(1); opacity:1 } }
  #emoji{ font-size:58px; line-height:1; }
  #title{ font-family:var(--display); font-size:28px; margin:10px 0 6px; }
  #title.win{ color:#2eb84f; }
  #title.lose{ color:#ff5d3a; }
  #msg{ font-size:16px; color:#5c6b80; margin-bottom:18px; }
  #btnRestart{
    border:none; cursor:pointer; color:#fff;
    font-family:var(--display); font-size:21px; letter-spacing:.5px;
    padding:15px 34px; border-radius:999px;
    background:linear-gradient(180deg,#ffb02e,#ff8c1a);
    box-shadow:0 6px 0 #d0690a, 0 10px 18px rgba(0,0,0,.25);
    transition:transform .06s, box-shadow .06s;
  }
  #btnRestart:active{ transform:translateY(4px); box-shadow:0 2px 0 #d0690a; }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<!-- Верхняя панель -->
<div id="hud">
  <div id="task">Собери 3 монеты и дойди до флага
    <div class="kb">На компьютере: стрелки или A/D, прыжок — пробел</div>
  </div>
  <div id="coins">
    <span class="slot"></span><span class="slot"></span><span class="slot"></span>
    <span id="coinCount">0/3</span>
  </div>
</div>

<div id="toast"></div>

<!-- Экранные кнопки -->
<div id="controls">
  <div class="pad">
    <button class="btn" id="btnLeft" aria-label="Влево">&#9664;</button>
    <button class="btn" id="btnRight" aria-label="Вправо">&#9654;</button>
  </div>
  <button class="btn jump" id="btnJump">ПРЫЖОК</button>
</div>

<!-- Оверлей конца уровня -->
<div id="overlay">
  <div id="card">
    <div id="emoji"></div>
    <div id="title"></div>
    <div id="msg"></div>
    <button id="btnRestart">Играть снова</button>
  </div>
</div>

<script>
/* =========================================================
   ВЕСЁЛЫЙ ПЛАТФОРМЕР
   Один файл, без внешних ресурсов. Управление: кнопки + клавиатура.
   ========================================================= */

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

/* --- размеры экрана --- */
let viewW = 0, viewH = 0, dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  canvas.width  = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  canvas.style.width  = viewW + 'px';
  canvas.style.height = viewH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();

/* --- блокируем скролл и зум страницы --- */
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.getElementById('controls').addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
   НАСТРОЙКИ ФИЗИКИ
   ========================================================= */
const GRAV   = 2300;   // гравитация, пикс/с^2
const MOVE   = 300;    // скорость бега, пикс/с
const JUMP   = 850;    // сила прыжка
const COYOTE = 0.10;   // "койот-тайм": можно прыгнуть чуть после края
const BUFFER = 0.14;   // буфер прыжка: нажали чуть раньше приземления

/* =========================================================
   УРОВЕНЬ: платформы, монеты, флаг, пропасть внизу
   ========================================================= */
const levelW = 2460;
const platforms = [
  { x:-40,  y:560, w:460, h:160 }, // стартовая земля
  { x:520,  y:480, w:200, h:36  }, // парящая 1
  { x:800,  y:400, w:180, h:36  }, // парящая 2 (выше всех)
  { x:1060, y:480, w:200, h:36  }, // парящая 3
  { x:1340, y:560, w:360, h:160 }, // вторая земля
  { x:1780, y:460, w:180, h:36  }, // парящая 4
  { x:2030, y:560, w:430, h:160 }  // финишная земля
];
const coinSpots = [ {x:620,y:424}, {x:890,y:344}, {x:1868,y:404} ];
const flag = { x:2280, y:560 };
const DEATH_Y = 880; // ниже этой линии герой падает в пропасть

/* цветные точки для конфетти */
const confettiColors = ['#ff5d5d','#ffd23f','#4dd463','#4db8ff','#c58bff','#ff9d3a'];

/* цветочки на земле для красоты */
const flowers = [
  {x:120,y:560,c:'#ff5d8f'},{x:330,y:560,c:'#ffd23f'},
  {x:1420,y:560,c:'#c58bff'},{x:1600,y:560,c:'#ff5d5d'},
  {x:2120,y:560,c:'#ff9d3a'},{x:2390,y:560,c:'#ff5d8f'}
];

/* облака для фона */
const clouds = [];
for(let i=0;i<6;i++){
  clouds.push({ x:Math.random()*1600, y:50+Math.random()*160, s:0.6+Math.random()*0.8, v:8+Math.random()*12 });
}

/* =========================================================
   СОСТОЯНИЕ ИГРЫ
   ========================================================= */
const player = { x:40, y:470, w:40, h:46, vx:0, vy:0, onGround:false, dir:1 };
let coins = [];
let coinsGot = 0;
let state = 'playing';       // playing | won | lost
let t = 0;                   // общее время для анимаций
let camX = 0, camY = 0;
let shakeT = 0;              // тряска камеры
let coyote = 0, jumpBuf = 0, jumpHeld = false;
let jumpT = 0, landT = 0, blinkT = 2, spawnT = 0.35, dustT = 0;
let flagHintT = 0;
let particles = [];
const input = { left:false, right:false };

/* --- переопределение уровня заново --- */
function resetLevel(){
  player.x = 40; player.y = 470; player.vx = 0; player.vy = 0;
  player.onGround = false; player.dir = 1;
  coins = coinSpots.map(c => ({ x:c.x, y:c.y, taken:false }));
  coinsGot = 0;
  particles = [];
  state = 'playing';
  spawnT = 0.35; shakeT = 0;
  camX = clamp(player.x - viewW/2, 0, Math.max(0, levelW - viewW));
  camY = camTargetY();
  updateHUD();
  document.getElementById('overlay').classList.remove('show');
}

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function rectsHit(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/* =========================================================
   ЗВУК: маленькие синтезированные эффекты (без файлов)
   ========================================================= */
let ac = null;
function audio(){
  if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f0, f1, dur, type, vol){
  const a = audio(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f0, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), a.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.12, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
const sfxJump  = () => tone(300, 620, 0.18, 'square', 0.10);
const sfxCoin  = () => { tone(880, 1320, 0.12, 'triangle', 0.18); setTimeout(()=>tone(1320, 1760, 0.14, 'triangle', 0.14), 70); };
const sfxLand  = () => tone(170, 110, 0.08, 'triangle', 0.08);
const sfxFall  = () => tone(420, 70, 0.5, 'sawtooth', 0.12);
const sfxWin   = () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f,0.18,'triangle',0.16), i*130)); };

/* =========================================================
   УПРАВЛЕНИЕ
   ========================================================= */
function holdButton(el, down, up){
  const press = e => { e.preventDefault(); audio(); down(); el.classList.add('press'); };
  const release = () => { if(up) up(); el.classList.remove('press'); };
  el.addEventListener('pointerdown', press);
  ['pointerup','pointercancel','pointerleave'].forEach(ev => el.addEventListener(ev, release));
}
holdButton(document.getElementById('btnLeft'),  ()=> input.left = true,  ()=> input.left = false);
holdButton(document.getElementById('btnRight'), ()=> input.right = true, ()=> input.right = false);
holdButton(document.getElementById('btnJump'),
  ()=>{ jumpHeld = true; jumpBuf = BUFFER; },
  ()=>{ jumpHeld = false; if(player.vy < 0) player.vy *= 0.55; } // короткий прыжок при раннем отпускании
);

/* клавиатура */
const keyMap = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };
window.addEventListener('keydown', e => {
  audio();
  if(state !== 'playing' && (e.code === 'Space' || e.code === 'Enter')){ resetLevel(); return; }
  if(keyMap[e.code] !== undefined){ input[keyMap[e.code]] = true; e.preventDefault(); }
  if((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && !e.repeat){
    jumpHeld = true; jumpBuf = BUFFER; e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  if(keyMap[e.code] !== undefined) input[keyMap[e.code]] = false;
  if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){
    jumpHeld = false; if(player.vy < 0) player.vy *= 0.55;
  }
});

/* =========================================================
   ИНТЕРФЕЙС: монеты, подсказки, оверлей
   ========================================================= */
const slots = document.querySelectorAll('.slot');
function updateHUD(){
  slots.forEach((s,i)=> s.classList.toggle('got', coins[i] && coins[i].taken));
  document.getElementById('coinCount').textContent = coinsGot + '/3';
}
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1700);
}
function showOverlay(kind){
  const title = document.getElementById('title');
  const msg = document.getElementById('msg');
  const emoji = document.getElementById('emoji');
  if(kind === 'win'){
    emoji.textContent = '🏆';
    title.textContent = 'Уровень пройден!';
    title.className = 'win';
    msg.textContent = 'Все монеты собраны, флаг твой. Отличная игра!';
  } else {
    emoji.textContent = '🙈';
    title.textContent = 'Упс! Попробуй снова';
    title.className = 'lose';
    msg.textContent = 'Герой свалился в пропасть. Ничего, получится!';
  }
  document.getElementById('overlay').classList.add('show');
}
document.getElementById('btnRestart').addEventListener('click', ()=>{ audio(); resetLevel(); });

/* =========================================================
   ЧАСТИЦЫ: пыль, искры, конфетти, всплывающий текст
   ========================================================= */
function addParticle(p){ particles.push(p); }
function burstDust(x, y, n){
  for(let i=0;i<n;i++) addParticle({
    type:'dust', x:x+(Math.random()-0.5)*20, y:y,
    vx:(Math.random()-0.5)*120, vy:-Math.random()*90,
    life:0.4+Math.random()*0.3, max:0.7, r:3+Math.random()*4
  });
}
function burstSparks(x, y){
  for(let i=0;i<12;i++){
    const a = Math.random()*Math.PI*2, sp = 120+Math.random()*160;
    addParticle({ type:'spark', x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-60,
      life:0.5+Math.random()*0.3, max:0.8, r:2.5+Math.random()*3 });
  }
}
function burstConfetti(x, y){
  for(let i=0;i<90;i++){
    const a = Math.random()*Math.PI*2, sp = 150+Math.random()*320;
    addParticle({ type:'confetti', x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-220,
      life:1.4+Math.random()*0.8, max:2.2, r:4+Math.random()*5,
      color:confettiColors[i % confettiColors.length], rot:Math.random()*6 });
  }
}
function floatText(x, y, txt){
  addParticle({ type:'text', x:x, y:y, vx:0, vy:-90, life:0.9, max:0.9, txt:txt });
}

/* =========================================================
   ОБНОВЛЕНИЕ ИГРЫ (вызывается каждый кадр с delta time)
   ========================================================= */
function camTargetY(){
  const minY = -260, maxY = 760 - viewH;
  if(maxY < minY) return (minY + maxY) / 2;
  return clamp(player.y + player.h/2 - viewH*0.56, minY, maxY);
}

function update(dt){
  t += dt;

  /* облака плывут всегда, даже в меню */
  for(const c of clouds){ c.x += c.v * dt; }

  /* тряска камеры затухает */
  if(shakeT > 0) shakeT = Math.max(0, shakeT - dt);

  /* частицы обновляются всегда */
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    if(p.type === 'confetti') p.vy += 700 * dt;
    if(p.type === 'dust') p.vy += 200 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if(p.type === 'confetti') p.rot += 6 * dt;
  }

  if(state !== 'playing') return;

  /* таймеры прыжка, моргания, появления */
  if(jumpBuf > 0) jumpBuf -= dt;
  if(jumpT > 0) jumpT -= dt;
  if(landT > 0) landT -= dt;
  if(spawnT > 0) spawnT -= dt;
  if(flagHintT > 0) flagHintT -= dt;
  blinkT -= dt;
  if(blinkT < -0.13) blinkT = 2 + Math.random()*3;

  /* --- горизонтальное движение с плавным разгоном --- */
  let target = 0;
  if(input.left)  target -= MOVE;
  if(input.right) target += MOVE;
  player.vx += (target - player.vx) * Math.min(1, dt*16);
  if(Math.abs(player.vx) > 12) player.dir = player.vx > 0 ? 1 : -1;

  /* --- прыжок: буфер + койот-тайм --- */
  if(player.onGround) coyote = COYOTE; else coyote -= dt;
  if(jumpBuf > 0 && coyote > 0){
    player.vy = -JUMP;
    jumpBuf = 0; coyote = 0;
    jumpT = 0.16;
    sfxJump();
    burstDust(player.x + player.w/2, player.y + player.h, 5);
  }

  /* --- перемещение по X и разбор столкновений --- */
  player.x += player.vx * dt;
  for(const p of platforms){
    if(rectsHit(player, p)){
      if(player.vx > 0) player.x = p.x - player.w;
      else if(player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }
  player.x = clamp(player.x, 0, levelW - player.w);

  /* --- перемещение по Y, гравитация --- */
  player.vy = Math.min(player.vy + GRAV * dt, 1500);
  const fallSpeed = player.vy;
  const wasGround = player.onGround;
  player.y += player.vy * dt;
  player.onGround = false;
  for(const p of platforms){
    if(rectsHit(player, p)){
      if(player.vy > 0){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        if(!wasGround && fallSpeed > 520){ // приземление с эффектом
          landT = 0.18; shakeT = 0.1;
          burstDust(player.x + player.w/2, player.y + player.h, 7);
          sfxLand();
        }
      } else if(player.vy < 0){
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  /* пыль из-под ног при беге */
  dustT -= dt;
  if(player.onGround && Math.abs(player.vx) > 150 && dustT <= 0){
    dustT = 0.09;
    addParticle({ type:'dust', x:player.x + player.w/2 - player.dir*14, y:player.y + player.h,
      vx:-player.dir*40, vy:-30, life:0.35, max:0.35, r:3.5 });
  }

  /* --- сбор монет --- */
  const pcx = player.x + player.w/2, pcy = player.y + player.h/2;
  coins.forEach(c => {
    if(c.taken) return;
    const dx = c.x - pcx, dy = (c.y + Math.sin(t*3 + c.x)*4) - pcy;
    if(Math.sqrt(dx*dx + dy*dy) < 40){
      c.taken = true; coinsGot++;
      sfxCoin();
      burstSparks(c.x, c.y);
      floatText(c.x, c.y - 20, '+1');
      updateHUD();
    }
  });

  /* --- проверка флага --- */
  const flagRect = { x:flag.x - 16, y:flag.y - 130, w:64, h:130 };
  if(rectsHit(player, flagRect)){
    if(coinsGot === coins.length){
      state = 'won';
      sfxWin();
      burstConfetti(flag.x, flag.y - 100);
      updateHUD();
      setTimeout(()=>{ if(state === 'won') showOverlay('win'); }, 700);
    } else if(flagHintT <= 0){
      flagHintT = 2;
      showToast('Сначала собери все монеты!');
    }
  }

  /* --- падение в пропасть --- */
  if(player.y > DEATH_Y){
    state = 'lost';
    sfxFall(); shakeT = 0.35;
    setTimeout(()=>{ if(state === 'lost') showOverlay('lose'); }, 550);
  }

  /* --- плавная камера следит за героем --- */
  const tx = clamp(player.x + player.w/2 - viewW/2, 0, Math.max(0, levelW - viewW));
  const ty = camTargetY();
  const k = 1 - Math.pow(0.0005, dt);
  camX += (tx - camX) * k;
  camY += (ty - camY) * k;
}

/* =========================================================
   РИСОВАНИЕ
   ========================================================= */
function rr(x, y, w, h, r){ // скруглённый прямоугольник
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, viewH);
  g.addColorStop(0, '#79d7ff');
  g.addColorStop(1, '#e2f9ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, viewW, viewH);

  /* солнышко с вращающимися лучами */
  const sx = viewW - 84, sy = 92;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(t * 0.15);
  ctx.fillStyle = 'rgba(255,223,94,.55)';
  for(let i=0;i<12;i++){
    ctx.rotate(Math.PI/6);
    ctx.fillRect(38, -5, 22, 10);
  }
  ctx.restore();
  const sg = ctx.createRadialGradient(sx, sy, 5, sx, sy, 40);
  sg.addColorStop(0, '#fff6c8'); sg.addColorStop(1, '#ffdf5e');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, 34, 0, Math.PI*2); ctx.fill();
}

function drawClouds(){
  const span = viewW + 320;
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for(const c of clouds){
    let sx = ((c.x - camX*0.25) % span + span) % span - 160;
    const y = c.y, s = c.s;
    ctx.beginPath();
    ctx.arc(sx, y, 24*s, 0, Math.PI*2);
    ctx.arc(sx+26*s, y-12*s, 20*s, 0, Math.PI*2);
    ctx.arc(sx+52*s, y, 22*s, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawHills(){
  const base = 560 - camY;
  /* дальние холмы */
  ctx.fillStyle = '#baf0a4';
  for(let i=0;i<9;i++){
    const cx = i*380 + 140 - camX*0.35;
    if(cx < -320 || cx > viewW + 320) continue;
    ctx.beginPath(); ctx.ellipse(cx, base + 40, 240, 150, 0, 0, Math.PI*2); ctx.fill();
  }
  /* ближние холмы */
  ctx.fillStyle = '#98e07e';
  for(let i=0;i<9;i++){
    const cx = i*380 + 320 - camX*0.55;
    if(cx < -280 || cx > viewW + 280) continue;
    ctx.beginPath(); ctx.ellipse(cx, base + 60, 200, 105, 0, 0, Math.PI*2); ctx.fill();
  }
}

function drawPlatform(p){
  const isGround = p.h > 60;
  if(isGround){
    /* земля: коричневая основа и зелёная шапка травы */
    ctx.fillStyle = '#a9713f';
    rr(p.x, p.y + 10, p.w, p.h - 10, 10); ctx.fill();
    /* камушки в земле, детерминированные по позиции */
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    for(let i=0;i<p.w/40;i++){
      const rnd = Math.sin(p.x*13.37 + i*7.7)*0.5 + 0.5;
      ctx.beginPath();
      ctx.arc(p.x + 18 + i*40, p.y + 55 + rnd*60, 4 + rnd*4, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#59c93c';
    rr(p.x, p.y, p.w, 24, 12); ctx.fill();
    ctx.fillStyle = '#8df06a';
    rr(p.x + 4, p.y + 3, p.w - 8, 8, 6); ctx.fill();
  } else {
    /* парящая платформа */
    ctx.fillStyle = '#b8874f';
    rr(p.x, p.y, p.w, p.h, 14); ctx.fill();
    ctx.fillStyle = '#59c93c';
    rr(p.x, p.y, p.w, 16, 12); ctx.fill();
    ctx.fillStyle = '#8df06a';
    rr(p.x + 4, p.y + 2, p.w - 8, 6, 5); ctx.fill();
  }
}

function drawFlowers(){
  for(const f of flowers){
    ctx.strokeStyle = '#2f9e44'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x, f.y - 18); ctx.stroke();
    ctx.fillStyle = f.c;
    for(let i=0;i<5;i++){
      const a = i/5*Math.PI*2 + t*0.4;
      ctx.beginPath(); ctx.arc(f.x + Math.cos(a)*6, f.y - 22 + Math.sin(a)*6, 4.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(f.x, f.y - 22, 4, 0, Math.PI*2); ctx.fill();
  }
}

function drawCoin(c, i){
  if(c.taken) return;
  const bob = Math.sin(t*3 + c.x)*4;
  const spin = 0.3 + 0.7*Math.abs(Math.sin(t*4 + i*2)); // вращение монеты
  const y = c.y + bob;
  ctx.save();
  ctx.translate(c.x, y);
  /* мягкое сияние */
  ctx.fillStyle = 'rgba(255,210,63,.25)';
  ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(t*5+i)*3, 0, Math.PI*2); ctx.fill();
  ctx.scale(spin, 1);
  const g = ctx.createRadialGradient(-5, -5, 2, 0, 0, 16);
  g.addColorStop(0, '#fff2a8'); g.addColorStop(1, '#ffc61a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#e09f1f'; ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#e09f1f';
  ctx.font = 'bold 16px "Trebuchet MS", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('★', 0, 1);
  ctx.restore();
}

function drawFlag(){
  const ready = coinsGot === coins.length;
  const x = flag.x, base = flag.y;
  /* пульсирующее сияние, когда все монеты собраны */
  if(ready){
    const a = 0.18 + Math.sin(t*5)*0.08;
    ctx.fillStyle = 'rgba(120,255,150,' + a + ')';
    ctx.beginPath(); ctx.arc(x, base - 80, 70 + Math.sin(t*5)*8, 0, Math.PI*2); ctx.fill();
  }
  /* холмик и полюс */
  ctx.fillStyle = '#59c93c';
  ctx.beginPath(); ctx.ellipse(x, base, 34, 12, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#7a5230';
  rr(x - 4, base - 132, 8, 132, 4); ctx.fill();
  /* золотой шарик на верхушке */
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(x, base - 136, 7, 0, Math.PI*2); ctx.fill();
  /* развевающийся флаг */
  const wv = Math.sin(t*5)*6;
  ctx.fillStyle = ready ? '#2ee06a' : '#35b05f';
  ctx.beginPath();
  ctx.moveTo(x + 4, base - 128);
  ctx.quadraticCurveTo(x + 36, base - 124 + wv, x + 66, base - 112);
  ctx.lineTo(x + 40, base - 104);
  ctx.lineTo(x + 4, base - 92);
  ctx.closePath(); ctx.fill();
  /* звёздочки вокруг готового флага */
  if(ready){
    ctx.fillStyle = '#fff2a8';
    for(let i=0;i<3;i++){
      const a = t*2 + i*Math.PI*2/3;
      const sx = x + Math.cos(a)*52, sy = base - 80 + Math.sin(a)*46;
      ctx.beginPath(); ctx.arc(sx, sy, 3.5, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawPlayer(){
  if(state === 'lost') return; // герой улетел в пропасть
  const p = player;
  const cx = p.x + p.w/2;
  /* squash and stretch: сжатие при приземлении, растяжение при прыжке */
  let sx = 1, sy = 1;
  if(jumpT > 0){ const k = jumpT/0.16; sy = 1 + 0.16*k; sx = 1 - 0.12*k; }
  else if(landT > 0){ const k = landT/0.18; sy = 1 - 0.2*k; sx = 1 + 0.18*k; }
  if(spawnT > 0){ const k = 0.35 + 0.65*(1 - spawnT/0.35); sx *= k; sy *= k; }

  ctx.save();
  ctx.translate(cx, p.y + p.h);
  ctx.rotate(clamp(p.vx/MOVE, -1, 1) * 0.06);
  ctx.scale(sx, sy);

  /* антенна с шариком */
  ctx.strokeStyle = '#d95b36'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, -46);
  ctx.quadraticCurveTo(Math.sin(t*4)*4, -56, Math.sin(t*4)*6, -60);
  ctx.stroke();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(Math.sin(t*4)*6, -62, 5, 0, Math.PI*2); ctx.fill();

  /* тело */
  ctx.fillStyle = '#ff7b54';
  rr(-20, -46, 40, 46, 13); ctx.fill();
  ctx.strokeStyle = '#d95b36'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#ffab8c';
  rr(-13, -22, 26, 16, 8); ctx.fill(); // животик

  /* глаза с морганием */
  const blink = blinkT < 0 ? 0.15 : 1;
  const lookX = clamp(p.vx/MOVE, -1, 1)*3 + p.dir*1.5;
  const lookY = clamp(p.vy/900, -1, 1)*3;
  for(const ex of [-9, 9]){
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(ex, -32, 7, 7*blink, 0, 0, Math.PI*2); ctx.fill();
    if(blink === 1){
      ctx.fillStyle = '#26313f';
      ctx.beginPath(); ctx.arc(ex + lookX, -32 + lookY, 3.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex + lookX - 1, -33 + lookY, 1.1, 0, Math.PI*2); ctx.fill();
    }
  }

  /* щёчки */
  ctx.fillStyle = 'rgba(255,120,120,.5)';
  ctx.beginPath(); ctx.arc(-13, -24, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -24, 3.5, 0, Math.PI*2); ctx.fill();

  /* рот: улыбка или удивлённый "о" в полёте */
  ctx.strokeStyle = '#8a3b22'; ctx.lineWidth = 2.5; ctx.fillStyle = '#8a3b22';
  if(p.vy < -60){
    ctx.beginPath(); ctx.arc(0, -20, 4, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, -23, 7, 0.25*Math.PI, 0.75*Math.PI); ctx.stroke();
  }
  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    const a = clamp(p.life / p.max, 0, 1);
    if(p.type === 'dust'){
      ctx.fillStyle = 'rgba(255,255,255,' + (a*0.8) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(1.6-a*0.6), 0, Math.PI*2); ctx.fill();
    } else if(p.type === 'spark'){
      ctx.fillStyle = 'rgba(255,205,40,' + a + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*a + 1, 0, Math.PI*2); ctx.fill();
    } else if(p.type === 'confetti'){
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*0.7);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if(p.type === 'text'){
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ff9d1a';
      ctx.font = 'bold 22px "Comic Sans MS", "Chalkboard SE", cursive';
      ctx.textAlign = 'center';
      ctx.fillText(p.txt, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }
}

function draw(){
  drawSky();
  drawClouds();
  drawHills();

  /* мир с учётом камеры и лёгкой тряски */
  const shX = shakeT > 0 ? (Math.random()-0.5)*shakeT*22 : 0;
  const shY = shakeT > 0 ? (Math.random()-0.5)*shakeT*22 : 0;
  ctx.save();
  ctx.translate(-camX + shX, -camY + shY);

  for(const p of platforms) drawPlatform(p);
  drawFlowers();
  drawFlag();
  coins.forEach((c,i)=> drawCoin(c,i));
  drawPlayer();
  drawParticles();

  ctx.restore();
}

/* =========================================================
   ГЛАВНЫЙ ЦИКЛ с delta time
   ========================================================= */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.033) dt = 0.033; // защита от больших скачков
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

resetLevel();
requestAnimationFrame(frame);
</script>
